[project]
name = "promptpilot"
version = "0.5.0"
description = "Background task queue for AI CLIs — queue, schedule, and retry prompts for Claude Code, Codex, Qwen and others"
requires-python = ">=3.10"
license = { text = "MIT" }
readme = "README.md"
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Environment :: Console",
]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "click>=8.1",
    "pydantic>=2.0",
    "python-telegram-bot[job-queue]>=21.0",
    "socksio>=1.0",  # SOCKS5 proxy support for the Telegram bot (via httpx)
    # Tray is Windows-first and needs a GUI; not required for server/worker/bot
    # on a Linux host, so keep it off headless installs.
    "pystray>=0.19; sys_platform == 'win32'",
    "Pillow>=10.0; sys_platform == 'win32'",
]

[project.scripts]
pp = "promptpilot.cli:cli"
promptpilot = "promptpilot.cli:cli"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["promptpilot"]

# Ship the Web UI with the package — without this the wheel has no
# static/index.html and `pp server` serves a 404 at /.
[tool.setuptools.package-data]
promptpilot = ["static/*"]
