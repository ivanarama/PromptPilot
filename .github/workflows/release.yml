name: Release

on:
  push:
    tags:
      - "v*.*.*"

# Least privilege by default; only the release job needs write (set below).
permissions:
  contents: read

jobs:
  build-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pyinstaller

      # Issue #79: a packaged pp.exe must be able to say which commit it was
      # built from (`pp --version`). The module is generated and never tracked.
      - name: Stamp build identity
        shell: bash
        run: |
          cat > promptpilot/_build_commit.py <<EOF
          BUILD_COMMIT = "${{ github.sha }}"
          BUILD_LABEL = "${{ github.ref_name }}"
          EOF

      - name: Build exe
        run: python -m PyInstaller pp.spec --clean

      - name: Create Windows archive
        run: |
          Copy-Item .env.example dist\.env
          Compress-Archive -Path dist\pp.exe, dist\.env, start.ps1, stop.ps1 `
            -DestinationPath "PromptPilot-${{ github.ref_name }}-windows.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: windows-zip
          path: "PromptPilot-${{ github.ref_name }}-windows.zip"

  build-exe-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pyinstaller

      - name: Stamp build identity
        shell: bash
        run: |
          cat > promptpilot/_build_commit.py <<EOF
          BUILD_COMMIT = "${{ github.sha }}"
          BUILD_LABEL = "${{ github.ref_name }}"
          EOF

      - name: Build binary
        run: python -m PyInstaller pp.spec --clean

      - name: Create Linux archive
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          cp .env.example dist/.env
          tar -czf "PromptPilot-${REF_NAME}-linux.tar.gz" -C dist pp .env

      - uses: actions/upload-artifact@v4
        with:
          name: linux-tar
          path: "PromptPilot-${{ github.ref_name }}-linux.tar.gz"

  build-wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build wheel
        run: |
          pip install build
          python -m build --wheel --sdist

      - name: Smoke-test wheel (Web UI must be packaged)
        run: |
          python -m venv /tmp/ppsmoke
          /tmp/ppsmoke/bin/pip install dist/promptpilot-*.whl
          # The wheel must ship promptpilot/static/index.html, or `pp server`
          # serves a 404 at / (this regressed once — keep the check).
          /tmp/ppsmoke/bin/python - <<'PY'
          import importlib.resources as r
          assert (r.files("promptpilot") / "static" / "index.html").is_file(), "static/index.html missing from wheel"
          print("OK: static/index.html present in installed package")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: python-dist
          path: dist/

  # Issue #79: the packaged Windows exe once shipped years-stale code while the
  # source tree already had Workflows. Run the artifact, not the sources:
  # the served UI must contain the Workflows panel and /api/workflows must
  # answer, and --version must name the commit the exe was built from.
  smoke-exe:
    needs: [build-exe]
    runs-on: windows-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: windows-zip

      - name: Unpack
        shell: pwsh
        run: Expand-Archive -Path "PromptPilot-*-windows.zip" -DestinationPath pp-smoke

      - name: --version carries the build identity
        shell: pwsh
        run: |
          $v = & .\pp-smoke\pp.exe --version
          Write-Host "pp --version → $v"
          if ($v -notlike "*build*") { throw "--version has no build stamp (issue #79)" }

      - name: Serve the exe and check Workflows UI + API
        shell: pwsh
        run: |
          $proc = Start-Process -FilePath ".\pp-smoke\pp.exe" `
            -ArgumentList "server", "--port", "8599" -PassThru
          try {
            $apiOk = $false
            foreach ($i in 1..45) {
              Start-Sleep -Seconds 2
              try {
                $api = Invoke-WebRequest -UseBasicParsing "http://127.0.0.1:8599/api/workflows"
                if ($api.StatusCode -eq 200) { $apiOk = $true; break }
              } catch { if ($proc.HasExited) { throw "pp.exe exited during startup" } }
            }
            if (-not $apiOk) { throw "GET /api/workflows did not return 200" }
            $page = Invoke-WebRequest -UseBasicParsing "http://127.0.0.1:8599/"
            if ($page.Content -notmatch "Workflows") { throw "served UI has no 'Workflows' (stale artifact?)" }
            if ($page.Content -notmatch "workflowModal") { throw "served UI has no 'workflowModal'" }
            Write-Host "OK: /api/workflows = 200, UI contains Workflows + workflowModal"
          } finally {
            Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
          }

  release:
    needs: [build-exe, build-exe-linux, build-wheel, smoke-exe]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: windows-zip

      - uses: actions/download-artifact@v4
        with:
          name: linux-tar

      - uses: actions/download-artifact@v4
        with:
          name: python-dist
          path: python-dist/

      # Supply-chain: this third-party action runs with contents:write and the
      # release token. Pin it (and the actions/* above) to a full commit SHA
      # rather than a moving tag, and enable Dependabot to bump the SHAs.
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "PromptPilot ${{ github.ref_name }}"
          body: |
            ## Установка

            ### Windows (exe)
            1. Скачай `PromptPilot-${{ github.ref_name }}-windows.zip`
            2. Распакуй в любую папку
            3. Заполни `.env` (шаблон уже внутри архива)
            4. Запусти `start.ps1` или `pp.exe server`

            ### Linux (standalone binary)
            ```bash
            tar -xzf PromptPilot-${{ github.ref_name }}-linux.tar.gz
            # заполни .env при необходимости (LiteLLM / токены)
            ./pp server
            ```

            ### Docker
            ```bash
            docker compose up -d --build
            # Web UI: http://localhost:8420
            ```

            ### Linux / Mac / Python
            ```bash
            pip install promptpilot-*.whl
            pp server
            ```
            Или из исходников:
            ```bash
            pip install git+https://github.com/${{ github.repository }}.git@${{ github.ref_name }}
            ```
          files: |
            PromptPilot-${{ github.ref_name }}-windows.zip
            PromptPilot-${{ github.ref_name }}-linux.tar.gz
            python-dist/*.whl
            python-dist/*.tar.gz
          draft: false
          prerelease: false
