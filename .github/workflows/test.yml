name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ruff
        run: python -m pip install ruff==0.16.9
      # Pyflakes-class errors only (see [tool.ruff.lint] in pyproject.toml):
      # undefined names, unused imports/variables — the kind of mistake that
      # otherwise surfaces as a NameError in production.
      - name: Lint
        run: ruff check promptpilot tests tools main.py

  pytest:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.12"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependencies
        run: python -m pip install -e ".[dev]" -c ci/requirements-ci.txt
      - name: Run tests
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
          TMPDIR: ${{ runner.temp }}
          PYTHONUNBUFFERED: "1"
        run: python -m pytest -vv -W error --durations=10 -o faulthandler_timeout=180
